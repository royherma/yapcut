<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapcut Sounds</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<style>
  :root {
    --bg: #111214; --panel: #17181b; --card: #1d1f23; --card-hover: #24272c; --line: #2a2d33;
    --text: #ececef; --muted: #8b8f98; --accent: #ffd23c; --accent-ink: #1a1500; --play: #7cc4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 100vh; height: 100vh; overflow: hidden; }

  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; overflow-y: auto; }
  aside h1 { font-size: 15px; margin: 0 8px 2px; letter-spacing: -.01em; }
  aside .total { color: var(--muted); margin: 0 8px 14px; font-size: 12px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 8px 6px; font-weight: 600; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px;
    background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .nav:hover { background: var(--card); }
  .nav.on { background: var(--card-hover); font-weight: 600; }
  .nav .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search input { width: 100%; padding: 8px 12px 8px 32px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; outline: none; }
  .search input:focus { border-color: #4a4f58; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--card-hover); color: var(--text); }
  .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .keys { color: var(--muted); font-size: 11px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  .grid { flex: 1; overflow-y: auto; padding: 14px 18px 40px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; align-content: start; }
  .card { background: var(--card); border: 1px solid transparent; border-radius: 10px; padding: 10px 10px 8px;
    cursor: pointer; position: relative; transition: background .12s, border-color .12s; }
  .card:hover { background: var(--card-hover); }
  .card.sel { border-color: #4a4f58; }
  .card.playing { border-color: var(--play); }
  .wave { position: relative; height: 34px; margin-bottom: 8px; }
  .wave svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wave .base { fill: #3a3e46; }
  .wave .fill { position: absolute; inset: 0; width: 0; overflow: hidden; }
  .wave .fill svg { width: var(--w); }
  .wave .fill path { fill: var(--play); }
  .row { display: flex; align-items: center; gap: 6px; }
  .name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .meta .sec { margin-left: auto; font-variant-numeric: tabular-nums; }
  .star { border: 0; background: none; padding: 2px; cursor: pointer; color: #555a63; line-height: 0; border-radius: 4px; }
  .star:hover { color: var(--accent); }
  .star.on { color: var(--accent); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 0; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #2e3138; color: #cfd2d8; border: 0; cursor: pointer; font-family: inherit; }
  .tag:hover { background: #3a3e46; }
  .addtag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: none; color: var(--muted);
    border: 1px dashed #3a3e46; cursor: pointer; opacity: 0; font-family: inherit; }
  .card:hover .addtag, .card.sel .addtag { opacity: 1; }
  .addtag:hover { color: var(--text); border-color: #555a63; }
  .tagin { font: 11px inherit; width: 90px; padding: 1px 7px; border-radius: 99px; border: 1px solid #555a63; background: var(--bg); color: var(--text); outline: none; }
  .grid.list { grid-template-columns: 1fr; gap: 2px; }
  .list .card { display: grid; align-items: center; gap: 14px; padding: 6px 12px; border-radius: 8px;
    grid-template-columns: 200px minmax(160px, 1.2fr) 130px 48px minmax(0, 1fr) 28px;
    grid-template-areas: "wave name cat sec tags star"; }
  .list .row, .list .meta { display: contents; }
  .list .wave { grid-area: wave; height: 26px; margin: 0; }
  .list .name { grid-area: name; }
  .list .cat { grid-area: cat; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .list .sec { grid-area: sec; margin: 0; text-align: right; color: var(--muted); font-size: 12px; }
  .list .tags { grid-area: tags; margin: 0; }
  .list .star { grid-area: star; }
  .cat { display: flex; align-items: center; gap: 6px; }
  .empty { grid-column: 1 / -1; color: var(--muted); padding: 60px 0; text-align: center; }
</style>
</head>
<body>
<aside>
  <h1>Sound Library</h1>
  <a href="/fx" style="display:block;margin:0 0 12px;color:var(--accent);font-size:13px">Video effects (23) &rarr;</a>
  <div class="total" id="total"></div>
  <button class="nav on" data-cat="">All sounds <span class="n" id="n-all"></span></button>
  <button class="nav" data-cat="★"><svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>Favorites <span class="n" id="n-fav"></span></button>
  <h2>Categories</h2>
  <div id="cats"></div>
  <h2>Tags</h2>
  <div id="tagnav"></div>
</aside>
<main>
  <div class="bar">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search whoosh, pop, ding, laugh..." autocomplete="off">
    </label>
    <div class="seg" id="len">
      <button data-len="" class="on">Any length</button>
      <button data-len="s">Under 1s</button>
      <button data-len="m">1-3s</button>
      <button data-len="l">Over 3s</button>
    </div>
    <div class="seg" id="mode">
      <button data-mode="grid" class="on">Grid</button>
      <button data-mode="list">List</button>
    </div>
    <span class="count" id="count"></span>
    <span class="keys"><kbd>/</kbd> search <kbd>←→</kbd> move <kbd>space</kbd> play <kbd>F</kbd> favorite <kbd>R</kbd> Finder</span>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
const STAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>';
let all = [], view = [], sel = -1, filt = { cat: '', len: '', q: '', tag: '' };
const audio = new Audio();
let playingId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const cats = [];
const hue = (cat) => `hsl(${(cats.indexOf(cat) * 360 / cats.length + 20) % 360} 55% 62%)`;

function wavePath(p) {
  const n = p.length || 1, w = 100 / n;
  return p.map((v, i) => { const h = Math.max(3, v * 0.32); return `M${(i * w + w * 0.18).toFixed(2)} ${(17 - h / 2).toFixed(2)}h${(w * 0.64).toFixed(2)}v${h.toFixed(2)}h-${(w * 0.64).toFixed(2)}z`; }).join('');
}

function card(s, i) {
  const d = wavePath(s.peaks);
  return `<div class="card${i === sel ? ' sel' : ''}${s.id === playingId ? ' playing' : ''}" data-i="${i}">
    <div class="wave"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><path class="base" d="${d}"/></svg>
      <div class="fill"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><path d="${d}"/></svg></div></div>
    <div class="row"><span class="name" title="${esc(s.name)}">${esc(s.name)}</span>
      <button class="star${s.fav ? ' on' : ''}" data-act="fav" aria-label="Favorite">${STAR}</button></div>
    <div class="meta"><span class="cat"><span class="dot" style="background:${hue(s.category)}"></span>${esc(s.category)}</span><span class="sec">${s.seconds.toFixed(1)}s</span></div>
    <div class="tags">${(s.tags || []).map((t) => `<button class="tag" data-act="tagf" data-t="${esc(t)}">${esc(t)}</button>`).join('')}<button class="addtag" data-act="addtag">+ tag</button></div>
  </div>`;
}

function apply() {
  const q = filt.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  view = all.filter((s) =>
    (!filt.cat || (filt.cat === '★' ? s.fav : s.category === filt.cat)) &&
    (!filt.tag || (s.tags || []).includes(filt.tag)) &&
    (!filt.len || (filt.len === 's' ? s.seconds < 1 : filt.len === 'm' ? s.seconds >= 1 && s.seconds <= 3 : s.seconds > 3)) &&
    q.every((w) => `${s.name} ${s.category} ${(s.tags || []).join(' ')}`.toLowerCase().includes(w)));
  sel = Math.min(sel, view.length - 1);
  $('grid').innerHTML = view.length ? view.map(card).join('') : '<div class="empty">No sounds match. Try a shorter word.</div>';
  $('count').textContent = `${view.length.toLocaleString()} sounds`;
  nav();
}

function nav() {
  const by = {}; all.forEach((s) => (by[s.category] = (by[s.category] || 0) + 1));
  $('n-all').textContent = all.length.toLocaleString();
  $('n-fav').textContent = all.filter((s) => s.fav).length;
  $('cats').innerHTML = cats.map((c) => `<button class="nav${filt.cat === c ? ' on' : ''}" data-cat="${esc(c)}"><span class="dot" style="background:${hue(c)}"></span>${esc(c)}<span class="n">${by[c]}</span></button>`).join('');
  const tags = {}; all.forEach((s) => (s.tags || []).forEach((t) => (tags[t] = (tags[t] || 0) + 1)));
  const names = Object.keys(tags).sort();
  $('tagnav').innerHTML = names.length ? names.map((t) => `<button class="nav${filt.tag === t ? ' on' : ''}" data-tag="${esc(t)}"># ${esc(t)}<span class="n">${tags[t]}</span></button>`).join('')
    : '<div class="total" style="margin-top:0">Hover a sound and click + tag</div>';
  document.querySelectorAll('aside > .nav').forEach((b) => b.classList.toggle('on', b.dataset.cat === filt.cat && !filt.tag));
}

function cardEl(i) { return $('grid').querySelector(`[data-i="${i}"]`); }

function select(i, scroll) {
  cardEl(sel)?.classList.remove('sel');
  sel = i;
  const el = cardEl(i);
  el?.classList.add('sel');
  if (scroll) el?.scrollIntoView({ block: 'nearest' });
}

function play(i) {
  const s = view[i]; if (!s) return;
  document.querySelector('.card.playing')?.classList.remove('playing');
  document.querySelectorAll('.fill').forEach((f) => (f.style.width = '0'));
  if (playingId === s.id && !audio.paused) { audio.pause(); playingId = null; return; }
  playingId = s.id;
  audio.src = '/sfx/' + encodeURIComponent(s.id).replace(/%2F/g, '/');
  audio.currentTime = 0; audio.play();
  cardEl(i)?.classList.add('playing');
}

function tick() {
  const i = view.findIndex((s) => s.id === playingId);
  const el = i >= 0 && cardEl(i);
  if (el && audio.duration) {
    const f = el.querySelector('.fill'), w = el.querySelector('.wave').clientWidth;
    f.style.setProperty('--w', w + 'px');
    f.style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
  requestAnimationFrame(tick);
}
audio.addEventListener('ended', () => { document.querySelector('.card.playing')?.classList.remove('playing'); playingId = null; });

async function mark(s, patch) {
  Object.assign(s, patch);
  await fetch('/api/mark', { method: 'POST', body: JSON.stringify({ id: s.id, ...patch }) });
}

function rerenderCard(i) {
  const el = cardEl(i); if (!el) return;
  el.outerHTML = card(view[i], i);
  nav();
}

$('grid').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (!c) return;
  const i = Number(c.dataset.i), s = view[i], act = e.target.closest('[data-act]')?.dataset.act;
  if (e.target.closest('.tagin')) return;
  if (act === 'fav') { mark(s, { fav: !s.fav }); rerenderCard(i); return; }
  if (act === 'tagf') { filt.tag = e.target.dataset.t; filt.cat = ''; apply(); return; }
  if (act === 'addtag') {
    const b = e.target.closest('.addtag');
    b.outerHTML = '<input class="tagin" placeholder="tag, Enter">';
    const inp = c.querySelector('.tagin'); inp.focus();
    const done = (save) => {
      const t = inp.value.trim().toLowerCase();
      if (save && t && !(s.tags || []).includes(t)) mark(s, { tags: [...(s.tags || []), t] });
      rerenderCard(i);
    };
    inp.addEventListener('keydown', (k) => { k.stopPropagation(); if (k.key === 'Enter') done(true); if (k.key === 'Escape') done(false); });
    inp.addEventListener('blur', () => done(true));
    return;
  }
  select(i); play(i);
});

$('grid').addEventListener('contextmenu', (e) => {
  const t = e.target.closest('.tag'); if (!t) return;
  e.preventDefault();
  const i = Number(t.closest('.card').dataset.i), s = view[i];
  mark(s, { tags: s.tags.filter((x) => x !== t.dataset.t) }); rerenderCard(i);
});

document.querySelector('aside').addEventListener('click', (e) => {
  const b = e.target.closest('.nav'); if (!b) return;
  if (b.dataset.tag !== undefined) { filt.tag = filt.tag === b.dataset.tag ? '' : b.dataset.tag; filt.cat = ''; }
  else { filt.cat = b.dataset.cat; filt.tag = ''; }
  sel = -1; apply(); $('grid').scrollTop = 0;
});
$('len').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  filt.len = b.dataset.len;
  $('len').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  apply();
});
function setMode(m) {
  $('grid').classList.toggle('list', m === 'list');
  $('mode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.mode === m));
  try { localStorage.setItem('sfx-mode', m); } catch {}
}
$('mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
try { setMode(localStorage.getItem('sfx-mode') || 'grid'); } catch { setMode('grid'); }
$('q').addEventListener('input', (e) => { filt.q = e.target.value; sel = -1; apply(); });

function cols() {
  const g = $('grid'), first = g.querySelector('.card');
  if (!first) return 1;
  return Math.max(1, Math.round(g.clientWidth / (first.offsetWidth + 8)));
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') { e.target.blur(); }
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); e.target.blur(); select(0, true); play(0); }
    return;
  }
  const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols(), ArrowUp: -cols() };
  if (e.key === '/') { e.preventDefault(); $('q').focus(); $('q').select(); }
  else if (moves[e.key] !== undefined) {
    e.preventDefault();
    const i = Math.max(0, Math.min(view.length - 1, (sel < 0 ? 0 : sel + moves[e.key])));
    select(i, true); play(i);
  } else if (e.key === ' ' && sel >= 0) { e.preventDefault(); play(sel); }
  else if ((e.key === 'f' || e.key === 'F') && sel >= 0) { mark(view[sel], { fav: !view[sel].fav }); rerenderCard(sel); select(sel); }
  else if ((e.key === 'r' || e.key === 'R') && sel >= 0) fetch('/api/reveal', { method: 'POST', body: JSON.stringify({ id: view[sel].id }) });
});

fetch('/api/sounds').then((r) => r.json()).then((d) => {
  all = d;
  d.forEach((s) => cats.includes(s.category) || cats.push(s.category));
  const mins = d.reduce((a, s) => a + s.seconds, 0) / 60;
  $('total').textContent = `${d.length.toLocaleString()} sounds · ${Math.round(mins)} min`;
  apply(); tick();
});
</script>
</body>
</html>
