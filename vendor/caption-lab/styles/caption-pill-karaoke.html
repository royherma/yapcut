<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pill Karaoke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--CL_DATA-->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: "Poppins", Arial, sans-serif;
      }

      #pill-karaoke {
        pointer-events: none;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }

      .caption-layer {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        transform: translateZ(0);
      }

      .cl-cue {
        position: absolute;
        inset: 0;
      }

      .caption-group {
        position: absolute;
        left: 60px;
        width: 960px;
        height: 220px;
        margin-top: -110px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }

      .caption-pill {
        width: auto;
        max-width: 960px;
        padding: 18px 60px 20px;
        border-radius: 22px;
        background: #e7e5e7;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        text-align: center;
        overflow: visible;
      }

      .caption-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        color: #a6a6a6;
        font-family: "Poppins", Arial, sans-serif;
        font-size: 72px;
        font-weight: 700;
        line-height: 1.16;
        letter-spacing: 0;
        white-space: nowrap;
        word-break: normal;
        overflow: visible;
      }

      .caption-line {
        display: flex;
        justify-content: center;
        gap: 16px;
        width: 100%;
        max-width: none;
        line-height: 1.16;
        white-space: nowrap;
        overflow: visible;
      }

      .caption-word {
        display: inline-block;
        color: #a6a6a6;
      }
    </style>
  </head>
  <body>
    <div
      id="pill-karaoke"
      data-cl-root
      data-composition-id="caption-pill-karaoke"
      data-timeline-locked
      data-start="0"
      data-duration="__CL_DURATION__"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!--CL_VIDEO-->
      <div class="caption-layer" aria-hidden="true">
        <div id="caption-stage"></div>
      </div>
    </div>

    <script>
      var DURATION = CL.duration;
      var PILL_MAX_WIDTH = 960;
      var PILL_MIN_PADDING_X = 30;
      var PILL_MAX_PADDING_X = 56;
      var FONT_WIDTH_SAFETY = 1.18;
      var FONT_FAMILY = "Poppins";
      var FONT_WEIGHT = "700";
      var BASE_FONT_SIZE = 68;
      var MIN_FONT_SIZE = 48;
      var WORD_SPACING = 14;
      var COLOR_INACTIVE = "#A6A6A6";
      var COLOR_ACTIVE = "#1C1E1D";
      var COLOR_FADE_DURATION = 0.1;
      var WORD_FADE_LEAD = 0.05;

      var measureCanvas = document.createElement("canvas");
      var measureContext = measureCanvas.getContext("2d");

      function measureWordWidth(text, fontSize) {
        measureContext.font = FONT_WEIGHT + " " + fontSize + "px " + FONT_FAMILY;
        return measureContext.measureText(text).width * FONT_WIDTH_SAFETY;
      }

      function measureLineWidth(words, fontSize) {
        return words.reduce(function (total, word, index) {
          return total + measureWordWidth(word.text.toLowerCase(), fontSize) + (index ? WORD_SPACING : 0);
        }, 0);
      }

      function splitLinesForGroup(words, fontSize) {
        var maxLineWidth = PILL_MAX_WIDTH - PILL_MIN_PADDING_X * 2;
        if (words.some(function (w) { return measureWordWidth(w.text.toLowerCase(), fontSize) > maxLineWidth; })) return null;
        if (measureLineWidth(words, fontSize) <= maxLineWidth) return [words];
        var bestSplit = null;
        var bestImbalance = Infinity;
        for (var split = 1; split < words.length; split++) {
          var a = words.slice(0, split), b = words.slice(split);
          var wa = measureLineWidth(a, fontSize), wb = measureLineWidth(b, fontSize);
          if (wa <= maxLineWidth && wb <= maxLineWidth && Math.abs(wa - wb) < bestImbalance) {
            bestSplit = [a, b];
            bestImbalance = Math.abs(wa - wb);
          }
        }
        return bestSplit;
      }

      function fontSizeForGroup(words) {
        var size = BASE_FONT_SIZE;
        while (size > MIN_FONT_SIZE && !splitLinesForGroup(words, size)) size -= 2;
        return size;
      }

      var GROUPS = CL.cues.map(function (cue) {
        return { cue: cue, words: CL.words.slice(cue.from, cue.to + 1) };
      });

      var stage = document.getElementById("caption-stage");
      GROUPS.forEach(function (group, gi) {
        var cueEl = document.createElement("div");
        cueEl.className = "cl-cue";
        cueEl.setAttribute("data-cl-cue", group.cue.id);
        var groupEl = document.createElement("div");
        groupEl.id = "caption-group-" + gi;
        groupEl.className = "caption-group";
        groupEl.style.top = CL.anchorY * CL.height + "px";
        var pillEl = document.createElement("div");
        pillEl.className = "caption-pill";
        var copyEl = document.createElement("div");
        copyEl.className = "caption-copy";
        var fontSize = fontSizeForGroup(group.words);
        copyEl.style.fontSize = fontSize + "px";
        var indexed = group.words.map(function (w, wi) { return { text: w.text, wordIndex: wi }; });
        var lines = splitLinesForGroup(indexed, fontSize) || [indexed];
        var widest = lines.reduce(function (m, l) { return Math.max(m, measureLineWidth(l, fontSize)); }, 0);
        var padX = Math.max(PILL_MIN_PADDING_X, Math.min(PILL_MAX_PADDING_X, Math.floor((PILL_MAX_WIDTH - widest) / 2)));
        pillEl.style.width = Math.min(PILL_MAX_WIDTH, Math.ceil(widest + padX * 2)) + "px";
        pillEl.style.paddingLeft = padX + "px";
        pillEl.style.paddingRight = padX + "px";
        lines.slice(0, 2).forEach(function (lineWords) {
          var lineEl = document.createElement("div");
          lineEl.className = "caption-line";
          lineWords.forEach(function (word) {
            var wordEl = document.createElement("span");
            wordEl.id = "caption-word-" + gi + "-" + word.wordIndex;
            wordEl.className = "caption-word";
            wordEl.textContent = word.text.toLowerCase();
            lineEl.appendChild(wordEl);
          });
          copyEl.appendChild(lineEl);
        });
        pillEl.appendChild(copyEl);
        groupEl.appendChild(pillEl);
        cueEl.appendChild(groupEl);
        stage.appendChild(cueEl);
      });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      GROUPS.forEach(function (group, gi) {
        var groupEl = document.getElementById("caption-group-" + gi);
        tl.set(groupEl, { opacity: 1 }, group.cue.show);
        tl.set(groupEl, { opacity: 0 }, group.cue.hide);
        group.words.forEach(function (word, wi) {
          var wordEl = document.getElementById("caption-word-" + gi + "-" + wi);
          tl.set(wordEl, { color: wi === 0 ? COLOR_ACTIVE : COLOR_INACTIVE }, group.cue.show);
          if (wi === 0) return;
          tl.to(wordEl, { color: COLOR_ACTIVE, duration: COLOR_FADE_DURATION, ease: "none" }, Math.max(group.cue.show, word.start - WORD_FADE_LEAD));
        });
      });
      tl.set({}, {}, DURATION);

      window.__timelines["caption-pill-karaoke"] = tl;
    </script>
  </body>
</html>
